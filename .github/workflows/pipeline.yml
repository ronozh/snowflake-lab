name: pipeline

on:
  push:
    branches: [main]
    paths:
      - "dbt/**"
      - "streamlit/**"
      - ".github/workflows/pipeline.yml"
  schedule:
    - cron: "0 20 * * *" # daily, ~06:00/07:00 Sydney
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail: a failed command in a pipe fails the step

concurrency:
  group: pipeline-dev
  cancel-in-progress: false

env:
  SNOW_CLI_VERSION: "3.28.0"

jobs:
  dev:
    runs-on: ubuntu-latest
    environment: dev
    env:
      DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}-${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
      DBT_SNOWFLAKE_USER: SNOWLAB_DEV_DEPLOY_SVC
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dbt Core (pinned)
        run: pip install -r dbt/requirements.txt

      - name: Deploy key
        env:
          KEY: ${{ secrets.SNOWFLAKE_DEPLOY_PRIVATE_KEY }}
        run: |
          key="$RUNNER_TEMP/deploy.p8"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$KEY" > "$key"
          echo "DBT_SNOWFLAKE_PRIVATE_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: dbt build
        working-directory: dbt
        run: |
          dbt --version
          dbt build

      - name: Semantic view (Cortex Analyst)
        working-directory: dbt
        run: dbt run-operation deploy_semantic_view

      - name: Install Snowflake CLI (pinned)
        run: pipx install "snowflake-cli==$SNOW_CLI_VERSION"

      - name: Streamlit app
        working-directory: streamlit
        run: |
          conn=(-x --account "$DBT_SNOWFLAKE_ACCOUNT" --user "$DBT_SNOWFLAKE_USER"
                --authenticator SNOWFLAKE_JWT --private-key-file "$DBT_SNOWFLAKE_PRIVATE_KEY_PATH"
                --role SNOWLAB_DEV_TRANSFORMER --warehouse SNOWLAB_DEV_WH --database SNOWLAB_DEV)
          snow streamlit deploy --replace "${conn[@]}" | { grep -v 'available under' || true; }  # URL has lowercase account id (masking is case-sensitive)
          snow sql "${conn[@]}" -q "GRANT USAGE ON STREAMLIT SNOWLAB_DEV.APP.SALES_DASHBOARD TO ROLE SNOWLAB_DEV_ANALYST" >/dev/null
          echo "deployed SNOWLAB_DEV.APP.SALES_DASHBOARD"
