name: zz-negative-test
on: { push: { paths: [".github/workflows/zz-negative-test.yml"] } }
permissions: { contents: read }
jobs:
  unpinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7          # not SHA-pinned -> must be rejected
  disallowed:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # not in allowlist
