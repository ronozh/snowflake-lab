name: terraform

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "scripts/ci/tf-apply.sh"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
# No pull_request trigger: solo repo, so fork PRs trigger nothing.

permissions:
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.8"
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ap-southeast-2

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive
      - name: validate
        run: |
          for d in bootstrap/aws terraform/aws terraform/snowflake/account terraform/snowflake/env; do
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate -no-color
          done

  # DEV only for now. Shared stacks (aws, snowflake/account) run here until
  # step 11 moves them behind the prod approval.
  dev:
    needs: validate
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS
    env:
      SNOWFLAKE_ORGANIZATION_NAME: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}
      SNOWFLAKE_ACCOUNT_NAME: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
      SNOWFLAKE_USER: TERRAFORM_SVC
      SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write config from secrets
        env:
          TF_BACKEND_HCL: ${{ secrets.TF_BACKEND_HCL }}
          TFVARS_AWS: ${{ secrets.TFVARS_AWS }}
          TFVARS_SNOWFLAKE_ENV: ${{ secrets.TFVARS_SNOWFLAKE_ENV }}
        run: |
          # Defence in depth: mask any email in tfvars even if printed by accident.
          grep -oE '[[:alnum:]._%+-]+@[[:alnum:].-]+' <<<"$TFVARS_AWS" | while read -r e; do echo "::add-mask::$e"; done
          printf '%s\n' "$TF_BACKEND_HCL"       > terraform/backend.hcl
          printf '%s\n' "$TFVARS_AWS"           > terraform/aws/terraform.tfvars
          printf '%s\n' "$TFVARS_SNOWFLAKE_ENV" > terraform/snowflake/env/dev.tfvars

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: aws
        run: scripts/ci/tf-apply.sh aws
      - name: snowflake/account
        run: scripts/ci/tf-apply.sh snowflake/account
      - name: snowflake/env (dev)
        run: scripts/ci/tf-apply.sh snowflake/env dev
